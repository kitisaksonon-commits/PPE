<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เบิกอุปกรณ์ PPE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f4e78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PPE EHS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{margin:0;height:100%;background:#1f4e78;font-family:Tahoma,"Noto Sans Thai",Arial,sans-serif}
#app{position:fixed;left:0;right:0;top:0;bottom:0;width:100%;height:100%;border:0;background:#f1f4f8;padding-top:env(safe-area-inset-top)}
#off{display:none;position:fixed;inset:0;background:#f1f4f8;color:#1d2733;text-align:center;padding:24px;align-items:center;justify-content:center;flex-direction:column}
#off.on{display:flex}
#off img{width:96px;height:96px;border-radius:22px;margin-bottom:14px}
#off h2{margin:0 0 6px}#off p{margin:0 0 18px;color:#667385}
#off button{font-size:17px;border:0;border-radius:10px;padding:14px 28px;background:#1f4e78;color:#fff;font-weight:700}
#load{position:fixed;inset:0;background:#1f4e78;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .3s}
#load img{width:96px;height:96px;border-radius:22px;margin-bottom:12px}
</style>
</head>
<body>
<div id="load"><img src="icon-192.png" alt=""><div>กำลังเปิดระบบ…</div></div>
<iframe id="app" title="PPE" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
<div id="off">
  <img src="icon-192.png" alt="">
  <h2>ไม่มีสัญญาณอินเทอร์เน็ต</h2>
  <p>ระบบเบิก PPE ต้องเชื่อมต่อเน็ตเพื่อตรวจยอดคงเหลือและบันทึกข้อมูล<br>กรุณาเชื่อมต่อเน็ตแล้วกดลองใหม่</p>
  <button id="retry">ลองใหม่</button>
</div>
<script>
/* ===== แก้เฉพาะบรรทัดนี้: วางลิงก์ Web app (/exec) ของคุณ ===== */
var APP_URL = 'https://script.google.com/macros/s/AKfycbxHmGJBTORlfO-IjN7jn7jzC0t1Mn_JXtyNkVz3URE5ksP1XvIN2Y0vNm5FnlKTPlKq/exec';
/* ============================================================ */
var f=document.getElementById('app'),off=document.getElementById('off'),ld=document.getElementById('load'),t=null;
function hideLoad(){ld.style.opacity='0';setTimeout(function(){ld.style.display='none';},320);}
function open_(){
  off.className='';
  if(!navigator.onLine){ld.style.display='none';off.className='on';return;}
  clearTimeout(t);
  t=setTimeout(function(){ if(!navigator.onLine){ld.style.display='none';off.className='on';} },12000);
  f.onload=function(){clearTimeout(t);hideLoad();};
  f.src=APP_URL+(APP_URL.indexOf('?')<0?'?':'&')+'_='+Date.now();
}
document.getElementById('retry').onclick=function(){ld.style.display='flex';ld.style.opacity='1';open_();};
window.addEventListener('online',function(){if(off.className==='on'){ld.style.display='flex';ld.style.opacity='1';open_();}});
window.addEventListener('offline',function(){});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
open_();
</script>
</body>
</html>
